<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <title>Elsmith Consulting LTD</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet" />

    <!-- Production Styles -->
    <link rel="stylesheet" crossorigin href="assets/index-Ow2yCcMq.css">
    <link rel="stylesheet" href="site_responsive.css">
    <link rel="stylesheet" href="booking_ui.css">

    <script>
      /**
       * ELSMITH VERCEL STABILITY LAYER
       * Fixes: Infinite Loading, Broken Redirects, and Missing Images.
       */
      window.__MANUS_HOST_DEV__ = false;

      (function() {
        // 1. Block Redirects to non-existent dev endpoints
        const block = (u) => String(u).includes('undefined') || String(u).includes('app-auth');
        const oa = window.location.assign, or = window.location.replace;
        window.location.assign = function(u) { if (!block(u)) oa.apply(window.location, arguments); };
        window.location.replace = function(u) { if (!block(u)) or.apply(window.location, arguments); };

        // 2. API Interceptor (Satisfy tRPC queries instantly)
        const of = window.fetch;
        window.fetch = function(url, options) {
          const urlStr = String(url);
          if (urlStr.includes('/api/')) {
             const cleanUrl = urlStr.replace('.php', '');
             if (cleanUrl.includes('/api/trpc') || cleanUrl.includes('/api/oauth')) {
                const mock = cleanUrl.includes('batch=1') ? [{ result: { data: {} } }] : { result: { data: {} } };
                return Promise.resolve(new Response(JSON.stringify(mock), {
                  status: 200, headers: { 'Content-Type': 'application/json' }
                }));
             }
             // For real API calls to our new Node.js endpoints (without .php)
             if (!urlStr.startsWith('http') && !urlStr.startsWith('//')) {
                 return of.apply(this, [cleanUrl, options]);
             }
          }
          return of.apply(this, arguments);
        };

        // 3. Handshake Pulse (Signals 'Ready' to bundled dev components)
        const pulse = () => {
          window.postMessage({ type: 'SpacePreviewerChannel', payload: { type: 'containerInited', to: 'content' } }, '*');
        };
        const interval = setInterval(pulse, 500);

        // 4. Global Image Path Corrector
        window.addEventListener('error', function(e) {
            if (e.target.tagName === 'IMG') {
                const src = e.target.getAttribute('src');
                if (src && src.startsWith('/')) {
                    e.target.src = src.substring(1);
                }
            }
        }, true);

        // Clear loading state once app mounts
        const observer = new MutationObserver(() => {
          if (document.getElementById('root').children.length > 0) {
            clearInterval(interval);
            console.log('Vercel Ready.');
            observer.disconnect();
          }
        });

        window.addEventListener('DOMContentLoaded', () => {
          const root = document.getElementById('root');
          if (root) observer.observe(root, { childList: true });
          pulse();
        });
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- Redesign Main Bundle -->
    <script type="module" crossorigin src="assets/index-ClrTScvG.js"></script>

    <!-- Post-Hydration Logic -->
    <script src="site_updates.js"></script>
    <script src="booking_ui.js"></script>
    <script src="main.js"></script>
  </body>

</html>
