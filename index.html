  <script>
    window.__MANUS_HOST_DEV__ = false;

    (function() {
      // 1. Block broken dev-server redirects
      const isDevUrl = (u) => String(u).includes('undefined') || String(u).includes('app-auth');
      const oa = window.location.assign, or = window.location.replace;
      window.location.assign = function(u) { if (!isDevUrl(u)) oa.apply(window.location, arguments); };
      window.location.replace = function(u) { if (!isDevUrl(u)) or.apply(window.location, arguments); };

      // 2. Resolve bundled IDE runtime dependency (Passive handshake)
      window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'SpacePreviewerChannel') {
          const p = e.data.payload;
          if (p && p.type === 'getMessage' && p.payload.messageType === 'containerInited') {
            window.postMessage({ type: 'SpacePreviewerChannel', payload: { type: 'containerInited', to: 'content' } }, '*');
          }
        }
      });

      // 3. API Interceptor - Block hanging GET requests only
      const of = window.fetch;
      window.fetch = function(url, options) {
        const urlStr = String(url);
        const method = (options && options.method || 'GET').toUpperCase();

        if (method === 'GET' && (urlStr.includes('/api/trpc') || urlStr.includes('/api/oauth'))) {
          const mock = urlStr.includes('batch=1') ? [{ result: { data: {} } }] : { result: { data: {} } };
          return Promise.resolve(new Response(JSON.stringify(mock), {
            status: 200, headers: { 'Content-Type': 'application/json' }
          }));
        }
        return of.apply(this, arguments);
      };
    })();
  </script>
